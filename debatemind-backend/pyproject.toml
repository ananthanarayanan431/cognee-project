[project]
name = "debatemind-backend"
version = "0.1.0"
description = "DebateMind API — FastAPI backend with LangGraph debate agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.7",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.39",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",
    "openai>=1.54.0",
    "langgraph==0.2.60",
    "cognee[neo4j]==0.1.40",
    "pgvector==0.3.6",
    "psycopg2-binary>=2.9.10,<3",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.0",
    "cachetools>=5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debatemind"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
