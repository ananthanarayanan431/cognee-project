name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Backend ────────────────────────────────────────────────────────────────

jobs:
  backend-lint:
    name: "Backend · lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debatemind-backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dev deps
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check debatemind/

      - name: Format check (ruff format)
        run: uv run ruff format --check debatemind/

  backend-test:
    name: "Backend · tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debatemind-backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: ci-secret-key-at-least-32-characters
      OPENROUTER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dev deps
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=debatemind --cov-report=term-missing

# ─── Frontend ───────────────────────────────────────────────────────────────

  frontend-lint:
    name: "Frontend · lint & typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  frontend-build:
    name: "Frontend · build"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
