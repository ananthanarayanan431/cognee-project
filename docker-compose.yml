services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debatemind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  debatemind-backend:
    build:
      context: ./debatemind-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./debatemind-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/debatemind
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./debatemind-backend/debatemind
          target: /debatemind-backend/debatemind
        - action: rebuild
          path: ./debatemind-backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://debatemind-backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - debatemind-backend

volumes:
  pgdata:
